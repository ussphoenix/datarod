# TLS is terminated upstream (Cloudflare/Traefik) so nginx's own $scheme is always "http".
# Honor the proto the upstream proxy already determined
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen              8080;
    listen              [::]:8080;

    sendfile            on;
    default_type        application/octet-stream;
    gzip                on;
    gzip_http_version   1.1;
    gzip_disable        "MSIE [1-6]\.";
    gzip_min_length     256;
    gzip_vary           on;
    gzip_proxied        expired no-cache no-store private auth;
    gzip_types          text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level     9;

    root                /usr/share/nginx/html;
    index               index.html index.htm;

    # Backend routes
    location ^~ /backend {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://$backend_upstream:8080$request_uri;
    }

    # Django media files (served from a mounted volume)
    location ^~ /media {
        root /usr/share/nginx/media;
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Cache css and js files
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Any route containing a file extension
    location ~ ^.+\..+$ {
        try_files $uri =404;
    }

    # Any route that doesn't have a file extension
    location / {
        try_files $uri $uri/ /index.html;
    }
}
